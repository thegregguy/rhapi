name: CI

on:
  push:
    branches: [ main, refactor/trader-modularization ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pytest -v --tb=short
      env:
        # Provide dummy env vars for tests
        API_KEY: test_key
        BASE64_PRIVATE_KEY: dGVzdF9rZXk=
        CB_API_KEY: test_cb_key
        CB_PRIVATE_KEY: test_cb_private
        AUTO_DRY_RUN: true
    
    - name: Test CLI loads
      run: |
        python auto_trader.py --test
      env:
        API_KEY: test_key
        BASE64_PRIVATE_KEY: dGVzdF9rZXk=
        CB_API_KEY: test_cb_key
        CB_PRIVATE_KEY: test_cb_private
        AUTO_DRY_RUN: true
